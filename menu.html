<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger House Menu - FoodHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-orange-500 flex items-center gap-2">🍕 FoodHub</a>
            <a href="index.html" class="text-sm font-semibold text-orange-500 hover:underline">← Back to Restaurants</a>
        </div>
    </header>

    <!-- Menu Content -->
    <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full">
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-8 flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9" class="w-20 h-20 rounded-xl object-cover">
            <div>
                <h3 class="text-2xl font-bold">Burger House & Co.</h3>
                <p class="text-gray-500 text-sm">Fast Food • ⭐ 4.9 (120+ reviews)</p>
            </div>
        </div>

        <h4 class="text-xl font-bold mb-6">Menu Items</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Menu Item 1 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <h5 class="font-bold text-gray-800">Double Patty Burger</h5>
                    <p class="text-orange-500 font-semibold text-sm mt-1">$9.99</p>
                </div>
                <button onclick="alert('Added to cart!')" class="bg-orange-500 hover:bg-orange-600 text-white text-xs px-4 py-2 rounded-lg transition font-medium cursor-pointer">Add to Cart</button>
            </div>

            <!-- Menu Item 2 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <h5 class="font-bold text-gray-800">Crispy Chicken Wings</h5>
                    <p class="text-orange-500 font-semibold text-sm mt-1">$6.99</p>
                </div>
                <button onclick="alert('Added to cart!')" class="bg-orange-500 hover:bg-orange-600 text-white text-xs px-4 py-2 rounded-lg transition font-medium cursor-pointer">Add to Cart</button>
            </div>

            <!-- Menu Item 3 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <h5 class="font-bold text-gray-800">French Fries</h5>
                    <p class="text-orange-500 font-semibold text-sm mt-1">$3.49</p>
                </div>
                <button onclick="alert('Added to cart!')" class="bg-orange-500 hover:bg-orange-600 text-white text-xs px-4 py-2 rounded-lg transition font-medium cursor-pointer">Add to Cart</button>
            </div>

        </div>
    </main>

    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 FoodHub. All rights reserved.</p>
    </footer>
</body>
</html>
