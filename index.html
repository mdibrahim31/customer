    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="./manifest.json" />
    <!-- WebAPK / PWA Early Setup -->
    <script type="text/javascript">
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('webapk-prompt-ready'));
        console.log('[WebAPK] Prompt ready & captured');
        var params = new URLSearchParams(window.location.search);
        if (params.get('auto_install') === '1' || (window.sessionStorage && window.sessionStorage.getItem('trigger_webapk_install') === 'true')) {
          try { window.sessionStorage.removeItem('trigger_webapk_install'); } catch (err) {}
          setTimeout(function() {
            e.prompt().catch(function() {});
          }, 350);
        }
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('webapk-installed'));
        console.log('[WebAPK] App successfully installed to App Drawer');
      });
      if ('serviceWorker' in navigator) {
        var registerSW = function() {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(function(reg) {
              console.log('[SW] Registered scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[SW] Registration notice:', err);
            });
        };
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('DOMContentLoaded', registerSW);
          window.addEventListener('load', registerSW);
        }
      }
    </script>
    <link rel="apple-touch-icon" href="./icons/icon-customer-192.png" />
    <link rel="icon" type="image/png" href="./icons/icon-customer-192.png" />
    <title>foodiplace - Food Delivery System</title>
    <meta name="description" content="foodiplace: All-in-one Cash-on-Delivery Food Delivery System with Customer App, Vendor Dashboard, Rider App, and Admin Control." />
    <meta property="og:title" content="foodiplace - Food Delivery System" />
    <meta property="og:description" content="foodiplace: All-in-one Cash-on-Delivery Food Delivery System with Customer App, Vendor Dashboard, Rider App, and Admin Control." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <!-- Safe window.alert guard for iframe environments -->
    <script type="text/javascript">
      (function() {
        var originalAlert = window.alert;
        window.alert = function(msg) {
          try {
            if (originalAlert) {
              originalAlert(msg);
            }
          } catch (e) {
            console.info('[Notice]', msg);
          }
        };
      })();
    </script>
    <!-- Single Page Apps for GitHub Pages redirect handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q['p'] !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q['p'] || '') +
              (q['q'] ? ('?' + q['q']) : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
  </head>
