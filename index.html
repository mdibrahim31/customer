<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Restaurants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; background-position: center;
        }
        [popover]::backdrop { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-orange-500 flex items-center gap-2">🍕 FoodHub</a>
            <button popovertarget="cartDrawer" class="relative bg-orange-50 hover:bg-orange-100 text-orange-600 px-4 py-2.5 rounded-xl transition flex items-center gap-2 font-medium cursor-pointer">
                🛒 <span>Cart</span>
                <span class="bg-orange-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">2</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">
        <!-- Hero Section -->
        <section class="hero-bg text-white py-20 px-4 text-center">
            <div class="max-w-3xl mx-auto">
                <h2 class="text-4xl md:text-5xl font-bold mb-4">Delicious Food, Delivered Fast</h2>
                <p class="text-gray-200 mb-8">Discover top-rated restaurants near you.</p>
            </div>
        </section>

        <!-- Restaurants Section -->
        <section class="max-w-7xl mx-auto px-4 py-10">
            <h3 class="text-2xl font-bold mb-6">Available Restaurants</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Restaurant Card 1 (Links to menu.html) -->
                <div class="bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition group">
                    <div class="h-48 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9" alt="Burger House" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    </div>
                    <div class="p-5">
                        <span class="text-xs bg-orange-100 text-orange-600 px-3 py-1 rounded-full font-semibold">Fast Food</span>
                        <h4 class="text-lg font-bold mt-2 text-gray-800">Burger House & Co.</h4>
                        <div class="flex items-center justify-between mt-4">
                            <span class="text-sm text-yellow-500 font-bold">⭐ 4.9</span>
                            <!-- Link to Menu Page -->
                            <a href="menu.html" class="bg-orange-500 hover:bg-orange-600 text-white text-xs px-3 py-2 rounded-lg transition font-medium">View Menu</a>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Cart Modal -->
    <div id="cartDrawer" popover class="w-11/12 max-w-md bg-white rounded-2xl shadow-2xl p-6 m-auto border">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h3 class="text-xl font-bold">🛒 Your Cart</h3>
            <button popovertarget="cartDrawer" popovertargetaction="hide" class="text-gray-500 font-bold text-xl cursor-pointer">&times;</button>
        </div>
        <p class="text-sm text-gray-600">Items added to your cart will appear here.</p>
    </div>

    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 FoodHub. All rights reserved.</p>
    </footer>
</body>
</html>
