<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telegram Bot Test</title>
</head>
<body>
    <input type="text" id="msgInput" placeholder="Hello likhun..." />
    <button onclick="sendMessage()">Bot-e Pathao</button>
    <p id="status"></p>

    <script>
        const BACKEND_URL = "https://your-backend.onrender.com";

        function sendMessage() {
            const text = document.getElementById("msgInput").value;

            fetch(`${BACKEND_URL}/send-to-bot`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("status").innerText = data.message;
            })
            .catch(err => {
                document.getElementById("status").innerText = "Error holo!";
            });
        }
    </script>
</body>
</html>
