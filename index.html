<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Menu from Supabase</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        ul { list-style-type: square; }
        li { margin-bottom: 8px; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Live Restaurant/Shop Menu (via Telegram & Supabase)</h2>
    <ul id="menuList">Loading menu...</ul>

    <script>
        const BACKEND_URL = "https://hello-world-lllw.onrender.com";

        function fetchMenu() {
            fetch(`${BACKEND_URL}/get-menu`)
                .then(res => res.json())
                .then(data => {
                    const listElement = document.getElementById("menuList");
                    listElement.innerHTML = "";

                    if (data.success && data.menu.length > 0) {
                        data.menu.forEach(item => {
                            const li = document.createElement("li");
                            li.innerText = item.item_name;
                            listElement.appendChild(li);
                        });
                    } else {
                        listElement.innerHTML = "<li>Kono menu nei ekhono. Bot-e message pathan!</li>";
                    }
                })
                .catch(err => {
                    console.error("Error:", err);
                    document.getElementById("menuList").innerHTML = "<li>Menu load korte error hoyeche!</li>";
                });
        }

        fetchMenu();
    </script>
</body>
</html>
